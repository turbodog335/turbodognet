<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сережааточкакок^_^</title>
<link rel="icon" href="assets/favicon.svg">
<style>
@import url("https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap");
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"MedievalSharp",cursive;color:#111}
body{background:#008080 url("assets/background.gif") center/cover fixed no-repeat}
a{color:#000080;text-decoration:underline}
a:hover{color:#ff00ff}
.page{min-height:100vh;padding:18px 18px 105px}
.window{max-width:1180px;margin:0 auto;background:#c0c0c0;border:2px solid #fff;box-shadow:2px 2px 0 #000,-2px -2px 0 #808080}
.titlebar{height:30px;padding:4px 7px;color:#fff;background:#000080;font-weight:bold;display:flex;align-items:center;justify-content:space-between;white-space:nowrap;overflow:hidden}
.titlebar span:first-child{overflow:hidden;text-overflow:ellipsis}
.buttons{display:flex;gap:3px;flex:none;margin-left:8px}
.btn{width:20px;height:20px;background:#c0c0c0;color:#000;border:2px outset #fff;text-align:center;line-height:16px;font-size:13px}
.menu{padding:7px 9px;border-bottom:2px solid #808080;display:flex;gap:7px;flex-wrap:wrap}
.menu a{padding:3px 10px;font-size:13px;text-decoration:none;color:#000;background:#c0c0c0;border:2px outset #fff}
.menu a.active{border-style:inset}
.content{padding:12px}
#content-frame{display:block;width:100%;height:560px;border:0;background:#efefef}
.footer{padding:7px 10px;border-top:2px solid #808080;font-size:12px}
#player-frame{position:fixed;left:0;right:0;bottom:0;width:100%;height:92px;border:0;z-index:50;background:#c0c0c0;box-shadow:0 -2px 0 #808080}
@media(max-width:700px){
 .page{padding:6px 4px 118px}
 .window{width:100%;max-width:none}
 .titlebar{height:28px;font-size:10px;padding:4px}
 .buttons{gap:2px}
 .btn{width:18px;height:18px;line-height:14px;font-size:11px}
 .menu{padding:5px 4px;gap:4px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
 .menu a{font-size:12px;padding:5px 9px;white-space:nowrap}
 .content{padding:7px 5px}
 #content-frame{height:calc(100vh - 230px);min-height:470px}
 .footer{font-size:10px;padding:5px}
 #player-frame{height:112px}
}
</style>
</head>
<body>
<div class="page">
  <div class="window">
    <div class="titlebar">
      <span id="page-titlebar">turbodog335/turbosabaka335/turbodog335lox/emokitty335/сережадурдомик</span>
      <div class="buttons"><span class="btn">_</span><span class="btn">□</span><span class="btn">×</span></div>
    </div>

    <nav class="menu">
      <a href="home.html" data-page="home">Главная</a>
      <a href="about.html" data-page="about">About</a>
      <a href="music.html" data-page="music">Музыка</a>
      <a href="games.html" data-page="games">Игры</a>
      <a href="links.html" data-page="links">Ссылки</a>
    </nav>

    <main class="content">
      <iframe id="content-frame" src="home.html" title="Содержимое сайта"></iframe>
    </main>

    <div class="footer">© turbolox • made on the web • <span id="time"></span></div>
  </div>
</div>

<iframe id="player-frame" src="player.html" title="Музыкальный плеер"></iframe>

<script>
const titles={
  home:"turbodog335/turbosabaka335/turbodog335lox/emokitty335/сережадурдомик",
  about:"Инфа обо мне(если вам вдруг интересно)",
  music:"Моя музыка",
  games:"На что я просрал свою жизнь(;_;)",
  links:"Сошал линки"
};
const pages={
  home:"home.html",about:"about.html",music:"music.html",games:"games.html",links:"links.html"
};

function navigate(name, push=true){
  if(!pages[name]) name="home";
  document.getElementById("content-frame").src=pages[name];
  document.getElementById("page-titlebar").textContent=titles[name];
  document.querySelectorAll(".menu a").forEach(a=>{
    a.classList.toggle("active",a.dataset.page===name);
  });
  if(push) history.replaceState(null,"","#"+name);
  document.getElementById("time").textContent=new Date().toLocaleTimeString();
}

document.querySelectorAll(".menu a").forEach(a=>{
  a.addEventListener("click",e=>{
    e.preventDefault();
    navigate(a.dataset.page);
  });
});

window.addEventListener("hashchange",()=>{
  navigate(location.hash.slice(1),false);
});

document.getElementById("time").textContent=new Date().toLocaleTimeString();
navigate(location.hash.slice(1)||"home",false);
</script>

<script>
window.addEventListener("message", function(e){
  if (!e.data || e.data.type !== "player-height") return;
  const frame = document.getElementById("player-frame");
  if (!frame) return;
  const h = Math.max(92, Math.min(500, Number(e.data.height) || 92));
  frame.style.height = h + "px";
});
</script>

</body>
</html>
