<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap");

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:"MedievalSharp",cursive;
  color:#111;
  background:#efefef;
}

.content{padding:1px}

.panel{
  background:#efefef;
  border:2px inset #fff;
  padding:12px;
  margin:0 0 12px;
}

h2{
  color:#000080;
  margin:0 0 12px;
  font-size:22px;
}

p{line-height:1.45}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.photo{
  background:#c0c0c0;
  border:2px outset #fff;
  padding:5px;
  cursor:pointer;
}

.photo:active{
  border-style:inset;
}

.photo img{
  display:block;
  width:100%;
  height:170px;
  object-fit:cover;
  background:#000;
  transition:transform .12s ease;
}

.photo:hover img{
  transform:scale(1.02);
}

.photo-name{
  margin-top:5px;
  font-size:11px;
  word-break:break-all;
}

.empty,.error{
  font-size:13px;
  color:#666;
}

/* ОКНО ПРОСМОТРА */
.lightbox{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.82);
  z-index:9999;
}

.lightbox.open{
  display:flex;
}

.lightbox-window{
  width:min(96vw,1100px);
  max-height:94vh;
  background:#c0c0c0;
  border:2px solid #fff;
  box-shadow:4px 4px 0 #000,-2px -2px 0 #808080;
  display:flex;
  flex-direction:column;
}

.lightbox-titlebar{
  min-height:30px;
  padding:4px 7px;
  color:#fff;
  background:#000080;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.lightbox-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.lightbox-close{
  width:20px;
  height:20px;
  flex:none;
  background:#c0c0c0;
  color:#000;
  border:2px outset #fff;
  text-align:center;
  line-height:16px;
  font-size:13px;
  cursor:pointer;
}

.lightbox-close:active{
  border-style:inset;
}

.lightbox-body{
  padding:10px;
  background:#808080;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
}

.lightbox-body img{
  display:block;
  max-width:calc(96vw - 40px);
  max-height:calc(94vh - 90px);
  width:auto;
  height:auto;
  object-fit:contain;
  background:#000;
}

@media(max-width:650px){
  html,body{overflow-x:hidden}
  .content{padding:0}
  .panel{padding:10px;margin-bottom:10px}
  h2{font-size:19px}
  p{font-size:14px;line-height:1.5}
  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .photo img{height:140px}
  .lightbox{padding:6px}
  .lightbox-window{width:100%;max-height:98vh}
  .lightbox-body img{
    max-width:calc(100vw - 30px);
    max-height:calc(98vh - 75px);
  }
}
</style>
</head>

<body>
<main class="content">

<section class="panel">
  <h2>Фото4ки<h2>

  <p>
    Мои крутые и не очень фотографии.
  </p>

  <div id="gallery" class="gallery">
    <div class="empty">Загрузка фотографий...</div>
  </div>
</section>

</main>

<!-- Полноэкранный просмотр -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lightbox-window" onclick="event.stopPropagation()">
    <div class="lightbox-titlebar">
      <span id="lightbox-title" class="lightbox-title">Фото</span>
      <button class="lightbox-close" type="button" onclick="closeLightbox()">×</button>
    </div>

    <div class="lightbox-body">
      <img id="lightbox-image" src="" alt="">
    </div>
  </div>
</div>

<script>
const API_URL =
  "https://api.github.com/repos/turbodog335/turbodognet/contents/assets/photos";

const RAW_BASE =
  "https://raw.githubusercontent.com/turbodog335/turbodognet/main/assets/photos/";

const IMAGE_EXTENSIONS =
  /\.(jpe?g|png|gif|webp|bmp|svg)$/i;

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const lightboxTitle = document.getElementById("lightbox-title");

async function loadPhotos(){
  const gallery=document.getElementById("gallery");

  try{
    const response =
      await fetch(API_URL,{cache:"no-store"});

    if(!response.ok){
      throw new Error("GitHub API error: "+response.status);
    }

    const files = await response.json();

    const images = files
      .filter(file =>
        file.type === "file" &&
        IMAGE_EXTENSIONS.test(file.name)
      )
      .sort((a,b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          {numeric:true}
        )
      );

    gallery.innerHTML="";

    if(!images.length){
      gallery.innerHTML =
        '<div class="empty">Пока нет фотографий.</div>';
      return;
    }

    for(const file of images){
      const url =
        RAW_BASE + encodeURIComponent(file.name);

      const card =
        document.createElement("div");
      card.className = "photo";
      card.title = "Нажми, чтобы открыть";
      card.tabIndex = 0;

      const img =
        document.createElement("img");
      img.src = url;
      img.alt = file.name;
      img.loading = "lazy";

      const name =
        document.createElement("div");
      name.className = "photo-name";
      name.textContent = file.name;

      card.appendChild(img);
      card.appendChild(name);
      gallery.appendChild(card);

      card.addEventListener("click", () => {
        openLightbox(url, file.name);
      });

      card.addEventListener("keydown", (event) => {
        if(event.key === "Enter" || event.key === " "){
          event.preventDefault();
          openLightbox(url, file.name);
        }
      });
    }

  }catch(error){
    console.error(error);

    gallery.innerHTML =
      '<div class="error">' +
      'Не удалось загрузить фотографии. ' +
      'Проверь папку assets/photos/.' +
      '</div>';
  }
}

function openLightbox(url,name){
  lightboxImage.src = url;
  lightboxImage.alt = name;
  lightboxTitle.textContent = name;
  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}

function closeLightbox(){
  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden","true");
  lightboxImage.src = "";
  document.body.style.overflow = "";
}

lightbox.addEventListener("click", closeLightbox);

document.addEventListener("keydown", (event) => {
  if(event.key === "Escape"){
    closeLightbox();
  }
});

loadPhotos();
</script>

</body>
</html>
