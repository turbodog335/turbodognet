<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap");

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:"MedievalSharp",cursive;
  color:#111;
  background:#efefef;
}

.content{padding:1px}

.panel{
  background:#efefef;
  border:2px inset #fff;
  padding:12px;
  margin:0 0 12px;
}

h2{
  color:#000080;
  margin:0 0 12px;
  font-size:22px;
}

p{line-height:1.45}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.photo{
  background:#c0c0c0;
  border:2px outset #fff;
  padding:5px;
  cursor:pointer;
}

.photo:active{
  border-style:inset;
}

.photo img{
  display:block;
  width:100%;
  height:170px;
  object-fit:cover;
  background:#000;
  transition:transform .12s ease;
}

.photo:hover img{
  transform:scale(1.02);
}

.photo-name{
  margin-top:5px;
  font-size:11px;
  word-break:break-all;
}

.empty,.error{
  font-size:13px;
  color:#666;
}


.lightbox{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.82);
  z-index:9999;
}

.lightbox.open{
  display:flex;
}

.lightbox-window{
  width:min(96vw,1100px);
  max-height:94vh;
  background:#c0c0c0;
  border:2px solid #fff;
  box-shadow:4px 4px 0 #000,-2px -2px 0 #808080;
  display:flex;
  flex-direction:column;
}

.lightbox-titlebar{
  min-height:30px;
  padding:4px 7px;
  color:#fff;
  background:#000080;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.lightbox-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.lightbox-close{
  width:20px;
  height:20px;
  flex:none;
  background:#c0c0c0;
  color:#000;
  border:2px outset #fff;
  text-align:center;
  line-height:16px;
  font-size:13px;
  cursor:pointer;
}

.lightbox-close:active{
  border-style:inset;
}

.lightbox-body{
  padding:10px;
  background:#808080;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
}

.lightbox-body img{
  display:block;
  max-width:calc(96vw - 40px);
  max-height:calc(94vh - 90px);
  width:auto;
  height:auto;
  object-fit:contain;
  background:#000;
}

@media(max-width:650px){
  html,body{overflow-x:hidden}
  .content{padding:0}
  .panel{padding:10px;margin-bottom:10px}
  h2{font-size:19px}
  p{font-size:14px;line-height:1.5}
  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .photo img{height:140px}
  .lightbox{padding:6px}
  .lightbox-window{width:100%;max-height:98vh}
  .lightbox-body img{
    max-width:calc(100vw - 30px);
    max-height:calc(98vh - 75px);
  }
}

        .photo-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .photo-caption {
            color: #fff;
            text-align: center;
            font-size: 15px;
            line-height: 1.3;
            word-break: break-word;
        }

    </style>
</head>

<body>
<main class="content">

<section class="panel">
  <h2>Фото4ки<h2>

  <p>
    Мои крутые и не очень фотографии.
  </p>

  <div id="gallery" class="gallery">
    <div class="empty">Еще посидим еще посидим...</div>
  </div>
</section>

</main>


<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lightbox-window" onclick="event.stopPropagation()">
    <div class="lightbox-titlebar">
      <span id="lightbox-title" class="lightbox-title">Фото</span>
      <button class="lightbox-close" type="button" onclick="closeLightbox()">×</button>
    </div>

    <div class="lightbox-body">
      <img id="lightbox-image" src="" alt="">
    </div>
  </div>
</div>




<script>
        const gallery = document.querySelector(".gallery");
        const photoPath = "assets/photos/photo";
        const captionsPath = "assets/photos/captions.txt";

        // Подписи хранятся отдельно в assets/photos/captions.txt.
        // Формат: номер=подпись
        // Например: 1=Фотка с поездки
        let captions = {};

        async function loadCaptions() {
            try {
                const response = await fetch(captionsPath + "?v=" + Date.now());
                if (!response.ok) return;

                const text = await response.text();

                text.split(/\r?\n/).forEach(line => {
                    line = line.trim();

                    if (!line || line.startsWith("#")) return;

                    const separator = line.indexOf("=");
                    if (separator === -1) return;

                    const number = line.slice(0, separator).trim();
                    const caption = line.slice(separator + 1).trim();

                    if (number) {
                        captions[number] = caption;
                    }
                });
            } catch (error) {
                // Если файла с подписями нет, фотографии всё равно загрузятся.
            }
        }

        function loadPhotos() {
            let photoNumber = 1;
            const maxPhotos = 1000;

            function tryNext() {
                if (photoNumber > maxPhotos) return;

                const number = photoNumber;
                const item = document.createElement("div");
                item.className = "photo-item";

                const img = new Image();

                img.onload = function () {
                    img.alt = "Фото " + number;
                    img.className = "gallery-photo";
                    img.onclick = function () {
                        openPhoto(img);
                    };

                    item.appendChild(img);

                    if (captions[number]) {
                        const caption = document.createElement("div");
                        caption.className = "photo-caption";
                        caption.textContent = captions[number];
                        item.appendChild(caption);
                    }

                    gallery.appendChild(item);

                    photoNumber++;
                    tryNext();
                };

                img.onerror = function () {
                    return;
                };

                img.src = photoPath + number + ".jpg";
            }

            tryNext();
        }

        function openPhoto(photo) {
            document.getElementById("bigPhoto").src = photo.src;
            document.getElementById("popup").classList.add("show");
        }

        function closePhoto() {
            document.getElementById("popup").classList.remove("show");
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closePhoto();
            }
        });

        document.getElementById("popup").addEventListener("click", function(event) {
            if (event.target === this || event.target.classList.contains("close")) {
                closePhoto();
            }
        });

        async function startGallery() {
            await loadCaptions();
            loadPhotos();
        }

        startGallery();
    </script>
</body>
</html>
