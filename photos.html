<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap");

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:"MedievalSharp",cursive;
  color:#111;
  background:#efefef;
}

.content{padding:1px}

.panel{
  background:#efefef;
  border:2px inset #fff;
  padding:12px;
  margin:0 0 12px;
}

h2{
  color:#000080;
  margin:0 0 12px;
  font-size:22px;
}

p{line-height:1.45}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.photo-item{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.photo{
  background:#c0c0c0;
  border:2px outset #fff;
  padding:5px;
  cursor:pointer;
}

.photo:active{
  border-style:inset;
}

.photo img{
  display:block;
  width:100%;
  height:170px;
  object-fit:cover;
  background:#000;
  transition:transform .12s ease;
}

.photo:hover img{
  transform:scale(1.02);
}

.photo-caption{
  color:#000;
  text-align:center;
  font-size:13px;
  line-height:1.3;
  word-break:break-word;
}

.empty,.error{
  font-size:13px;
  color:#666;
}

.lightbox{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.82);
  z-index:9999;
}

.lightbox.open{
  display:flex;
}

.lightbox-window{
  width:min(96vw,1100px);
  max-height:94vh;
  background:#c0c0c0;
  border:2px solid #fff;
  box-shadow:4px 4px 0 #000,-2px -2px 0 #808080;
  display:flex;
  flex-direction:column;
}

.lightbox-titlebar{
  min-height:30px;
  padding:4px 7px;
  color:#fff;
  background:#000080;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.lightbox-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.lightbox-close{
  width:20px;
  height:20px;
  flex:none;
  background:#c0c0c0;
  color:#000;
  border:2px outset #fff;
  text-align:center;
  line-height:16px;
  font-size:13px;
  cursor:pointer;
}

.lightbox-close:active{
  border-style:inset;
}

.lightbox-body{
  padding:10px;
  background:#808080;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
}

.lightbox-body img{
  display:block;
  max-width:calc(96vw - 40px);
  max-height:calc(94vh - 90px);
  width:auto;
  height:auto;
  object-fit:contain;
  background:#000;
}

@media(max-width:650px){
  html,body{overflow-x:hidden}
  .content{padding:0}
  .panel{padding:10px;margin-bottom:10px}
  h2{font-size:19px}
  p{font-size:14px;line-height:1.5}
  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .photo img{height:140px}
  .lightbox{padding:6px}
  .lightbox-window{width:100%;max-height:98vh}
  .lightbox-body img{
    max-width:calc(100vw - 30px);
    max-height:calc(98vh - 75px);
  }
}
</style>
</head>

<body>
<main class="content">

<section class="panel">
  <h2>Фото4ки</h2>

  <p>
    Мои крутые и не очень фотографии.
  </p>

  <div id="gallery" class="gallery">
    <div class="empty">Загрузка фотографий...</div>
  </div>
</section>

</main>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lightbox-window" onclick="event.stopPropagation()">
    <div class="lightbox-titlebar">
      <span id="lightbox-title" class="lightbox-title">Фото</span>
      <button id="lightbox-close" class="lightbox-close" type="button">×</button>
    </div>

    <div class="lightbox-body">
      <img id="lightbox-image" src="" alt="">
    </div>
  </div>
</div>

<script>
const gallery = document.getElementById("gallery");
const manifestPath = "assets/photos/photos.json";
const captionsPath = "assets/photos/captions.txt";

let captions = {};

async function loadCaptions() {
  try {
    const response = await fetch(captionsPath + "?v=" + Date.now());
    if (!response.ok) return;

    const text = await response.text();

    text.split(/\r?\n/).forEach(line => {
      line = line.trim();

      if (!line || line.startsWith("#")) return;

      const separator = line.indexOf("=");
      if (separator === -1) return;

      const key = line.slice(0, separator).trim();
      const caption = line.slice(separator + 1).trim();

      if (key) captions[key] = caption;
    });
  } catch (error) {
    console.warn("Не удалось загрузить captions.txt", error);
  }
}

function naturalSort(a, b) {
  return a.localeCompare(b, undefined, {
    numeric: true,
    sensitivity: "base"
  });
}

function captionFor(photo) {
  // Для photo22.jpg ищем подпись по ключу 22.
  if (photo.number !== null && captions[String(photo.number)]) {
    return captions[String(photo.number)];
  }

  // Для других имён файлов можно использовать имя файла как ключ.
  const key = photo.name.replace(/\.[^.]+$/, "");
  return captions[key] || "";
}

function openPhoto(photo) {
  const lightbox = document.getElementById("lightbox");
  const image = document.getElementById("lightbox-image");
  const title = document.getElementById("lightbox-title");

  image.src = photo.src;
  image.alt = photo.name;
  title.textContent = captionFor(photo) || photo.name;

  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden", "false");
}

function closeLightbox() {
  const lightbox = document.getElementById("lightbox");
  const image = document.getElementById("lightbox-image");

  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden", "true");
  image.src = "";
}

function createPhoto(photo) {
  const item = document.createElement("div");
  item.className = "photo-item";

  const button = document.createElement("div");
  button.className = "photo";
  button.tabIndex = 0;
  button.setAttribute("role", "button");

  const img = document.createElement("img");
  img.src = photo.src;
  img.alt = photo.name;
  img.loading = "lazy";

  button.appendChild(img);

  button.addEventListener("click", () => openPhoto(photo));
  button.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openPhoto(photo);
    }
  });

  item.appendChild(button);

  const captionText = captionFor(photo);
  if (captionText) {
    const caption = document.createElement("div");
    caption.className = "photo-caption";
    caption.textContent = captionText;
    item.appendChild(caption);
  }

  return item;
}

async function loadPhotos() {
  try {
    const response = await fetch(manifestPath + "?v=" + Date.now());

    if (!response.ok) {
      throw new Error("photos.json не найден");
    }

    const photos = await response.json();

    gallery.innerHTML = "";

    if (!Array.isArray(photos) || photos.length === 0) {
      gallery.innerHTML = '<div class="empty">Фотографий пока нет.</div>';
      return;
    }

    photos
      .filter(photo => photo && photo.src)
      .sort((a, b) => naturalSort(a.name || "", b.name || ""))
      .forEach(photo => {
        gallery.appendChild(createPhoto(photo));
      });

  } catch (error) {
    console.error(error);
    gallery.innerHTML =
      '<div class="error">Не удалось загрузить список фотографий.</div>';
  }
}

document.getElementById("lightbox-close").addEventListener("click", closeLightbox);

document.getElementById("lightbox").addEventListener("click", event => {
  if (event.target.id === "lightbox") {
    closeLightbox();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeLightbox();
  }
});

async function startGallery() {
  await loadCaptions();
  await loadPhotos();
}

startGallery();
</script>
</body>
</html>
