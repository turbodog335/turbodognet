<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap");

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:"MedievalSharp",cursive;
  color:#111;
  background:#efefef;
}

.content{
  padding:1px;
}

.panel{
  background:#efefef;
  border:2px inset #fff;
  padding:12px;
  margin:0 0 12px;
}

h2{
  color:#000080;
  margin:0 0 12px;
  font-size:22px;
}

p{
  line-height:1.45;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.photo{
  background:#c0c0c0;
  border:2px outset #fff;
  padding:5px;
}

.photo img{
  display:block;
  width:100%;
  height:170px;
  object-fit:cover;
  background:#000;
}

.photo-name{
  margin-top:5px;
  font-size:11px;
  word-break:break-all;
}

.empty,
.error{
  font-size:13px;
  color:#666;
}

@media(max-width:650px){

  html,body{
    overflow-x:hidden;
  }

  .content{
    padding:0;
  }

  .panel{
    padding:10px;
    margin-bottom:10px;
  }

  h2{
    font-size:19px;
  }

  p{
    font-size:14px;
    line-height:1.5;
  }

  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .photo img{
    height:140px;
  }
}
</style>
</head>

<body>

<main class="content">

<section class="panel">

  <h2>📷 Мои фото</h2>

  <p>
    мои крутые и не очень фотки.
  </p>

  <div id="gallery" class="gallery">
    <div class="empty">
      Загрузка фотографий...
    </div>
  </div>

</section>

</main>

<script>

const API_URL =
  "https://api.github.com/repos/turbodog335/turbodognet/contents/assets/photos";

const RAW_BASE =
  "https://raw.githubusercontent.com/turbodog335/turbodognet/main/assets/photos/";

const IMAGE_EXTENSIONS =
  /\.(jpe?g|png|gif|webp|bmp|svg)$/i;


async function loadPhotos(){

  const gallery =
    document.getElementById("gallery");

  try{

    const response =
      await fetch(API_URL,{cache:"no-store"});

    if(!response.ok){
      throw new Error(
        "GitHub API error: " +
        response.status
      );
    }

    const files =
      await response.json();

    const images =
      files
        .filter(file =>
          file.type === "file" &&
          IMAGE_EXTENSIONS.test(file.name)
        )
        .sort((a,b) =>
          a.name.localeCompare(
            b.name,
            undefined,
            {numeric:true}
          )
        );

    gallery.innerHTML = "";

    if(!images.length){

      gallery.innerHTML =
        '<div class="empty">' +
        'Пока нет фотографий.' +
        '</div>';

      return;
    }


    for(const file of images){

      const card =
        document.createElement("div");

      card.className = "photo";


      const img =
        document.createElement("img");

      img.src =
        RAW_BASE +
        encodeURIComponent(file.name);

      img.alt = file.name;
      img.loading = "lazy";


      const name =
        document.createElement("div");

      name.className =
        "photo-name";

      name.textContent =
        file.name;


      card.appendChild(img);
      card.appendChild(name);

      gallery.appendChild(card);
    }

  }catch(error){

    console.error(error);

    gallery.innerHTML =
      '<div class="error">' +
      'че то че то. ' +
      'не грузит бля.' +
      '</div>';
  }
}

loadPhotos();

</script>

</body>
</html>
