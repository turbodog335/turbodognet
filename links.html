<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ссылки</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap");
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"MedievalSharp",cursive;color:#111;background:#efefef}
body{padding:0}
.content{padding:1px}
.panel{background:#efefef;border:2px inset #fff;padding:14px;margin:0 0 14px}
h1,h2,h3{color:#000080;margin:0 0 12px}
h2{font-size:22px}
h3{font-size:18px}
p{line-height:1.45}
.hero{display:grid;grid-template-columns:215px 1fr;gap:18px;align-items:center}
.avatar{width:215px;height:215px;object-fit:cover;border:2px solid #808080;box-shadow:1px 1px 0 #fff}
.status{display:inline-block;background:#000080;color:#fff;padding:4px 9px;font-size:12px;margin:6px 0 10px}
.meta{background:#fff;border:2px inset #fff;padding:10px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
ul{line-height:1.6}
a{color:#000080}
a:hover{color:#ff00ff}
.small{font-size:12px}
@media(max-width:650px){
 html,body{overflow-x:hidden}
 .content{padding:0}
 .panel{padding:10px;margin-bottom:10px}
 h2{font-size:19px}
 h3{font-size:17px}
 .hero,.grid{grid-template-columns:1fr}
 .hero{gap:10px}
 .avatar{width:min(180px,55vw);height:min(180px,55vw);margin:0 auto}
 p,li{font-size:14px;line-height:1.5}
 li{margin-bottom:5px}
 a{word-break:break-word}
 .small{font-size:11px}
}
</style>
</head>
