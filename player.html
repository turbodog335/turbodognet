<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#c0c0c0;font-family:Arial,sans-serif;font-size:13px;color:#111}
body{overflow:hidden}
.player{padding:3px 7px;border-top:2px solid #fff;box-shadow:inset 0 1px 0 #808080}
.row{display:flex;align-items:center;gap:6px;min-width:0}
button{font:inherit;background:#c0c0c0;border:2px outset #fff;padding:2px 7px;height:23px;cursor:pointer;flex:none}
button:active{border-style:inset}
#title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin-left:3px}
.seek{display:grid;grid-template-columns:34px 1fr 34px;gap:5px;align-items:center;margin:1px 0}
input[type=range]{width:100%}
.bottom{display:flex;align-items:center;gap:7px;font-size:12px}
#list{
  display:none;
  margin-top:5px;
  background:#c0c0c0;
  border:2px solid #fff;
  box-shadow:2px 2px 0 #000;
  padding:5px;
  max-height:235px;
  overflow:auto;
}
#list.open{display:block}
.track{display:block;width:100%;text-align:left;margin:2px 0;min-height:38px}
.track small{display:block;margin-left:22px}
.track.selected{border-style:inset}
@media(max-width:600px){
  body{overflow:hidden}
  .player{padding:3px 5px}
  .row{gap:3px}
  button{min-width:38px;height:29px;padding:2px 6px;font-size:11px}
  #title{font-size:10px}
  .seek{grid-template-columns:32px 1fr 32px;gap:4px;margin:2px 0}
  input[type=range]{height:22px;touch-action:none}
  .bottom{gap:5px;justify-content:space-between;font-size:11px}
  #volume{width:78px}
  #tracks{min-width:78px}
  #list{max-height:220px;margin-top:5px}
  .track{min-height:39px;padding:4px 6px}
}
</style>
</head>
<body>
<div class="player">
  <div class="row">
    <button id="prev">◀</button>
    <button id="play">▶ PLAY</button>
    <button id="next">▶</button>
    <span id="title"></span>
  </div>

  <div class="seek">
    <span id="current">0:00</span>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
    <span id="duration">0:00</span>
  </div>

  <div class="bottom">
    <label>VOL <input id="volume" type="range" min="0" max="1" step="0.01"></label>
    <button id="tracks">☰ TRACKS</button>
  </div>

  <div id="list"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const playlist=[
 {title:"New kind of love",artist:"Frou Frou",src:"assets/song.mp3"},
 {title:"для тебя",artist:"дарк бриллиант корсес",src:"assets/song2.mp3"},
 {title:"Оторву руки",artist:"Villian",src:"assets/song3.mp3"},
 {title:"Мешают спать",artist:"Villian",src:"assets/song4.mp3"},
 {title:"Bender++Girlfriend",artist:"Yung Lean",src:"assets/song5.mp3"},
 {title:"Bye.Bay",artist:"Zombiqe",src:"assets/song6.mp3"},
 {title:"Safe Place",artist:"Sqwore",src:"assets/Safe Place.mp3"}
];

const audio=document.getElementById("audio");
const $=id=>document.getElementById(id);
let current=Number(localStorage.getItem("site_music_track")||0);

if(!Number.isFinite(current)||current<0||current>=playlist.length) current=0;

const savedVolume=localStorage.getItem("site_music_volume");
$("volume").value=savedVolume ?? "0.65";
audio.volume=Number($("volume").value);

function fmt(s){
  if(!Number.isFinite(s)) return "0:00";
  return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
}

function render(){
  $("list").innerHTML=playlist.map((t,i)=>
    `<button class="track ${i===current?"selected":""}" data-i="${i}">
      <b>${i+1}.</b> ${t.title}
      <small>${t.artist}</small>
    </button>`
  ).join("");

  document.querySelectorAll("[data-i]").forEach(b=>{
    b.addEventListener("click",()=>{
      load(Number(b.dataset.i),true);
    });
  });
}

function sendHeight(){
  // The list is in normal document flow, so the iframe can size itself to it.
  const open=$("list").classList.contains("open");
  const height=open ? Math.ceil(document.querySelector(".player").getBoundingClientRect().height)+4 : 66;
  if(window.parent!==window){
    window.parent.postMessage({type:"player-height",height}, "*");
  }
}

function load(i,autoplay=false){
  current=(i+playlist.length)%playlist.length;
  localStorage.setItem("site_music_track",current);

  const t=playlist[current];
  audio.src=t.src;
  $("title").textContent=`♫ ${t.title} — ${t.artist}`;
  render();
  update();

  const saved=Number(localStorage.getItem("site_music_time")||0);

  audio.addEventListener("loadedmetadata",()=>{
    if(saved>0 && saved<audio.duration) audio.currentTime=saved;
    update();
  },{once:true});

  if(autoplay) audio.play().catch(()=>{});
}

function update(){
  $("play").textContent=audio.paused?"▶ PLAY":"❚❚ PAUSE";
  $("current").textContent=fmt(audio.currentTime);
  $("duration").textContent=fmt(audio.duration);
  $("seek").value=audio.duration ? (audio.currentTime/audio.duration*100) : 0;
}

$("play").onclick=()=>{
  if(audio.paused) audio.play().catch(()=>{});
  else audio.pause();
};

$("prev").onclick=()=>{
  localStorage.setItem("site_music_time","0");
  load(current-1,true);
};

$("next").onclick=()=>{
  localStorage.setItem("site_music_time","0");
  load(current+1,true);
};

$("tracks").onclick=()=>{
  $("list").classList.toggle("open");
  sendHeight();
};

$("volume").oninput=()=>{
  audio.volume=Number($("volume").value);
  localStorage.setItem("site_music_volume",$("volume").value);
};

$("seek").oninput=e=>{
  if(audio.duration) audio.currentTime=audio.duration*Number(e.target.value)/100;
};

audio.ontimeupdate=update;
audio.onloadedmetadata=update;
audio.onplay=update;
audio.onpause=update;
audio.onended=()=>load(current+1,true);

setInterval(()=>{
  if(!audio.paused) localStorage.setItem("site_music_time",String(audio.currentTime));
},1000);

window.addEventListener("resize",sendHeight);

load(current,false);
setTimeout(sendHeight,50);
</script>
</body>
</html>
